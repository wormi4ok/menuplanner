name: CI

on:
  push:
    branches:
      - "!*"
    tags:
      - '*'

jobs:
  build-web:
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    # webpack 4 calls crypto md4, removed from the OpenSSL 3 default provider
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check code-style
        run: npm run lint
      - name: Build project
        run: |
          npm run build
          cd ..
          mkdir release
          tar -czf release/web.tar.gz web/dist
          shasum -a 256 release/web.tar.gz > release/web.tar.gz.sha256
          zip -r release/web.zip web/dist
          shasum -a 256 release/web.zip > release/web.zip.sha256
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: release
  build-api:
    runs-on: ubuntu-latest
    needs: build-web
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.16.x
      #      - name: Test
      #        run: go test ./...
      - name: Download Web UI artifact
        uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: release
      - name: Build API docs
        uses: kpurdon/openapi-generator-action@v0.0.3
        with:
          args: generate -i api.yml -g html2 -o docs
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release -f .goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
