name: CI

on:
  push:
    branches:
      - "!*"
    tags:
      - '*'

jobs:
  build-web:
    defaults:
      run:
        working-directory: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check code-style
        run: npm run lint
      - name: Build project
        run: |
          npm run build
          cd ..
          mkdir release
          tar -czf release/web.tar.gz web/dist
          shasum -a 256 release/web.tar.gz > release/web.tar.gz.sha256
          zip -r release/web.zip web/dist
          shasum -a 256 release/web.zip > release/web.zip.sha256
      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: web-ui
          path: release
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web UI image
        uses: docker/build-push-action@v6
        with:
          context: web
          target: prod
          push: true
          build-args: MP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/wormi4ok/menuplanner-web:${{ github.ref_name }}
            ghcr.io/wormi4ok/menuplanner-web:latest
  build-api:
    runs-on: ubuntu-latest
    needs: build-web
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download Web UI artifact
        uses: actions/download-artifact@v8
        with:
          name: web-ui
          path: release
      - name: Build API docs
        run: make api-docs
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release -f .goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
