name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Check code-style
        run: npm run lint
        working-directory: web
      - name: Resolve version
        run: echo "MP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - name: Build project
        run: npm run build
        working-directory: web
        env:
          MP_CLIENT_ID: ${{ vars.MP_CLIENT_ID }}
          API_ADDRESS: ${{ vars.API_ADDRESS }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=menuplanner --branch=${{ github.ref_name }}
